services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ota-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-ota}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    profiles: ["application"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      ENVIRONMENT: development
      AUTO_MIGRATE: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-ota}:${POSTGRES_PASSWORD:-ota-local-only}@postgres:5432/${POSTGRES_DB:-ota}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SUPABASE_AUTH_ISSUER: ${SUPABASE_AUTH_ISSUER:-https://haytetewtgbfxnolrhjz.supabase.co/auth/v1}
      SUPABASE_AUTH_AUDIENCE: ${SUPABASE_AUTH_AUDIENCE:-authenticated}
      ATTESTATION_PROVIDER: ${ATTESTATION_PROVIDER:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
